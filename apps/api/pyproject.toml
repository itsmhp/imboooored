[project]
name = "imb-api"
version = "0.0.0"
description = "imbooored REST API (Flask)."
requires-python = ">=3.14,<3.15"
dependencies = [
  "Flask==3.1.3",
  "gunicorn==26.2.0",
  "alembic==1.20.1",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "structlog==26.1.0",
  "redis==8.1.0",
  "SQLAlchemy==2.1.8",
  "psycopg[binary]==3.3.8",
]

[tool.uv]
# Virtual member: no build backend needed, imported via pythonpath (see S01 design section 14).
package = false
