[project]
name = "imb-shared"
version = "0.0.0"
description = "Code shared by the imbooored api and worker: settings, logging, db, rate limiter, clock."
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "structlog==26.1.0",
  "redis==8.1.0",
  "SQLAlchemy==2.1.8",
  "psycopg[binary]==3.3.8",
]

[tool.uv]
# Virtual member: no build backend needed, imported via pythonpath (see S01 design section 14).
package = false
